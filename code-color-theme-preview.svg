<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <style>
    .page { fill: #f3f4f6; }
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    .card-title-light { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
    .card-title-dark { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
    .caption-light { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    .caption-dark { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .code { font: 16px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; white-space: pre; }
    .shadow { filter: drop-shadow(0 18px 28px rgb(15 23 42 / 0.16)); }
  </style>

  <rect class="page" width="1280" height="900"/>
  <text class="title" x="64" y="60">Python Code Color Preview</text>
  <text class="subtitle" x="64" y="88">Same Python snippet rendered in four common syntax-color styles.</text>

  <!-- GitHub Light -->
  <g class="shadow" transform="translate(64 130)">
    <rect width="550" height="315" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text class="card-title-light" x="28" y="38">GitHub Light</text>
    <text class="caption-light" x="28" y="62">Clean, bright, note-friendly.</text>
    <rect x="28" y="86" width="494" height="199" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="code" x="50" y="124">
      <tspan fill="#6e7781"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#cf222e">def</tspan><tspan fill="#24292f"> </tspan><tspan fill="#8250df">calculate_total</tspan><tspan fill="#24292f">(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#24292f">    total = price * (</tspan><tspan fill="#0550ae">1</tspan><tspan fill="#24292f"> + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#cf222e">    if</tspan><tspan fill="#24292f"> total &gt; </tspan><tspan fill="#0550ae">100</tspan><tspan fill="#24292f">:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#cf222e">        return</tspan><tspan fill="#24292f"> </tspan><tspan fill="#0a3069">"expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#cf222e">    return</tspan><tspan fill="#24292f"> total</tspan></tspan>
    </text>
  </g>

  <!-- VS Code Dark+ -->
  <g class="shadow" transform="translate(666 130)">
    <rect width="550" height="315" rx="12" fill="#1e1e1e" stroke="#3c3c3c"/>
    <text class="card-title-dark" x="28" y="38">VS Code Dark+</text>
    <text class="caption-dark" x="28" y="62">Classic editor look, high contrast but familiar.</text>
    <rect x="28" y="86" width="494" height="199" rx="8" fill="#252526" stroke="#3c3c3c"/>
    <text class="code" x="50" y="124">
      <tspan fill="#6a9955"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#c586c0">def</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#dcdcaa">calculate_total</tspan><tspan fill="#d4d4d4">(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#d4d4d4">    total = price * (</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#d4d4d4"> + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c586c0">    if</tspan><tspan fill="#d4d4d4"> total &gt; </tspan><tspan fill="#b5cea8">100</tspan><tspan fill="#d4d4d4">:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c586c0">        return</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#ce9178">"expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c586c0">    return</tspan><tspan fill="#d4d4d4"> total</tspan></tspan>
    </text>
  </g>

  <!-- Dracula -->
  <g class="shadow" transform="translate(64 495)">
    <rect width="550" height="315" rx="12" fill="#282a36" stroke="#44475a"/>
    <text class="card-title-dark" x="28" y="38">Dracula</text>
    <text class="caption-dark" x="28" y="62">Vivid, playful, stronger color personality.</text>
    <rect x="28" y="86" width="494" height="199" rx="8" fill="#21222c" stroke="#44475a"/>
    <text class="code" x="50" y="124">
      <tspan fill="#6272a4"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#ff79c6">def</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#50fa7b">calculate_total</tspan><tspan fill="#f8f8f2">(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#f8f8f2">    total = price * (</tspan><tspan fill="#bd93f9">1</tspan><tspan fill="#f8f8f2"> + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#ff79c6">    if</tspan><tspan fill="#f8f8f2"> total &gt; </tspan><tspan fill="#bd93f9">100</tspan><tspan fill="#f8f8f2">:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#ff79c6">        return</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#f1fa8c">"expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#ff79c6">    return</tspan><tspan fill="#f8f8f2"> total</tspan></tspan>
    </text>
  </g>

  <!-- One Dark -->
  <g class="shadow" transform="translate(666 495)">
    <rect width="550" height="315" rx="12" fill="#282c34" stroke="#3e4451"/>
    <text class="card-title-dark" x="28" y="38">One Dark</text>
    <text class="caption-dark" x="28" y="62">Softer dark theme, balanced for longer reading.</text>
    <rect x="28" y="86" width="494" height="199" rx="8" fill="#21252b" stroke="#3e4451"/>
    <text class="code" x="50" y="124">
      <tspan fill="#5c6370"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#c678dd">def</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#61afef">calculate_total</tspan><tspan fill="#abb2bf">(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#abb2bf">    total = price * (</tspan><tspan fill="#d19a66">1</tspan><tspan fill="#abb2bf"> + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c678dd">    if</tspan><tspan fill="#abb2bf"> total &gt; </tspan><tspan fill="#d19a66">100</tspan><tspan fill="#abb2bf">:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c678dd">        return</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#98c379">"expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#c678dd">    return</tspan><tspan fill="#abb2bf"> total</tspan></tspan>
    </text>
  </g>
</svg>
