<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120">
  <defs>
    <style>
      .bg { fill: #fff; }
      .center { fill: #fff; stroke: #26323d; stroke-width: 2.5; }
      .main { fill: #fff; stroke-width: 2.2; }
      .sub { fill: #fff; stroke-width: 1.6; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .thin { fill: none; stroke-width: 1.8; stroke-linecap: round; }
      .logic { fill: none; stroke: #9aa4ad; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
      .logicText { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b747d; }
      .title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .mainText { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202a33; }
      .subText { font: 450 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #47525d; }
      .noteText { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #58636e; }
    </style>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa4ad" />
    </marker>
  </defs>
  <rect class="bg" width="1900" height="1120"/>
  <rect class="center" x="70" y="470" rx="24" width="370" height="170"/>
  <text class="title" x="255" y="518" text-anchor="middle">THE FUTURE</text>
  <text class="title" x="255" y="558" text-anchor="middle">OF CURRY BRAND</text>
  <text class="subText" x="255" y="598" text-anchor="middle">从官宣合作到全球扩张</text>
  <text class="noteText" x="80" y="705">阅读线索：</text>
  <text class="noteText" x="80" y="735">宣言定调 → 长期愿景 → 价值观信任 → 产品验证 → 选择标准 → 全球落地</text>

<path class="line" stroke="#5B8DEF" d="M440 555 C565 130 665 125 790 105"/>
<rect class="main" stroke="#5B8DEF" x="790" y="47" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="92" text-anchor="middle">1. 开篇定调</text>
<text class="subText" x="1015" y="128" text-anchor="middle">把合作定义为长期事业</text>
<path class="thin" stroke="#5B8DEF" d="M1240 89 C1260 84 1275 84 1290 84"/>
<rect class="sub" stroke="#B7CCF5" x="1290" y="57" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="92" text-anchor="middle">超越球鞋合同</text>
<path class="thin" stroke="#5B8DEF" d="M1240 127 C1260 160 1275 160 1290 160"/>
<rect class="sub" stroke="#B7CCF5" x="1290" y="133" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="168" text-anchor="middle">未来绑定李宁</text>
<path class="logic" d="M1015 165 L1015 210"/>
<text class="logicText" x="1038" y="191" text-anchor="start">从宣言进入长期愿景</text>
<path class="line" stroke="#58A55C" d="M440 555 C565 293 665 288 790 268"/>
<rect class="main" stroke="#58A55C" x="790" y="210" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="255" text-anchor="middle">2. 愿景展开</text>
<text class="subText" x="1015" y="291" text-anchor="middle">借李宁创新扩展 Curry Bra…</text>
<path class="thin" stroke="#58A55C" d="M1240 252 C1260 247 1275 247 1290 247"/>
<rect class="sub" stroke="#B8DDBA" x="1290" y="220" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="255" text-anchor="middle">篮球、高尔夫、生活方式</text>
<path class="thin" stroke="#58A55C" d="M1240 290 C1260 323 1275 323 1290 323"/>
<rect class="sub" stroke="#B8DDBA" x="1290" y="296" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="331" text-anchor="middle">激励全球年轻运动员</text>
<path class="logic" d="M1015 328 L1015 373"/>
<text class="logicText" x="1038" y="354" text-anchor="start">由品牌愿景转向为什么信任李宁</text>
<path class="line" stroke="#D99A2B" d="M440 555 C565 456 665 451 790 431"/>
<rect class="main" stroke="#D99A2B" x="790" y="373" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="418" text-anchor="middle">3. 信任来源</text>
<text class="subText" x="1015" y="454" text-anchor="middle">李宁的运动员创始人基因</text>
<path class="thin" stroke="#D99A2B" d="M1240 415 C1260 410 1275 410 1290 410"/>
<rect class="sub" stroke="#EBCB8B" x="1290" y="383" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="418" text-anchor="middle">李宁先生：奥运冠军与企业家</text>
<path class="thin" stroke="#D99A2B" d="M1240 453 C1260 486 1275 486 1290 486"/>
<rect class="sub" stroke="#EBCB8B" x="1290" y="459" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="494" text-anchor="middle">双方都有运动员创牌抱负</text>
<path class="logic" d="M1015 491 L1015 536"/>
<text class="logicText" x="1038" y="517" text-anchor="start">由价值观契合转入产品验证</text>
<path class="line" stroke="#8B6FD6" d="M440 575 C565 619 665 614 790 594"/>
<rect class="main" stroke="#8B6FD6" x="790" y="536" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="581" text-anchor="middle">4. 产品验证</text>
<text class="subText" x="1015" y="617" text-anchor="middle">试穿经历证明合作可行</text>
<path class="thin" stroke="#8B6FD6" d="M1240 578 C1260 573 1275 573 1290 573"/>
<rect class="sub" stroke="#C6B8EA" x="1290" y="546" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="581" text-anchor="middle">韦德与巴特勒鞋款体验</text>
<path class="thin" stroke="#8B6FD6" d="M1240 616 C1260 649 1275 649 1290 649"/>
<rect class="sub" stroke="#C6B8EA" x="1290" y="622" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="657" text-anchor="middle">品质、舒适度、性能</text>
<path class="logic" d="M1015 654 L1015 699"/>
<text class="logicText" x="1038" y="680" text-anchor="start">由产品体验转向合作选择标准</text>
<path class="line" stroke="#26A69A" d="M440 575 C565 782 665 777 790 757"/>
<rect class="main" stroke="#26A69A" x="790" y="699" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="744" text-anchor="middle">5. 选择标准</text>
<text class="subText" x="1015" y="780" text-anchor="middle">产品与人都值得相信</text>
<path class="thin" stroke="#26A69A" d="M1240 741 C1260 736 1275 736 1290 736"/>
<rect class="sub" stroke="#9DD8D2" x="1290" y="709" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="744" text-anchor="middle">真正以体育为核心</text>
<path class="thin" stroke="#26A69A" d="M1240 779 C1260 812 1275 812 1290 812"/>
<rect class="sub" stroke="#9DD8D2" x="1290" y="785" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="820" text-anchor="middle">重视全球篮球与运动员</text>
<path class="logic" d="M1015 817 L1015 862"/>
<text class="logicText" x="1038" y="843" text-anchor="start">由选择理由转向商业落地</text>
<path class="line" stroke="#E06C75" d="M440 575 C565 945 665 940 790 920"/>
<rect class="main" stroke="#E06C75" x="790" y="862" rx="16" width="450" height="118"/>
<text class="mainText" x="1015" y="907" text-anchor="middle">6. 全球落地</text>
<text class="subText" x="1015" y="943" text-anchor="middle">资源、门店与影响力扩张</text>
<path class="thin" stroke="#E06C75" d="M1240 904 C1260 899 1275 899 1290 899"/>
<rect class="sub" stroke="#F0B6BB" x="1290" y="872" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="907" text-anchor="middle">中国篮球份额领先，亚洲7600+店</text>
<path class="thin" stroke="#E06C75" d="M1240 942 C1260 975 1275 975 1290 975"/>
<rect class="sub" stroke="#F0B6BB" x="1290" y="948" rx="12" width="410" height="56"/>
<text class="subText" x="1495" y="983" text-anchor="middle">中美 Curry Brand 门店计划</text>
</svg>