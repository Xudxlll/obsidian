<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
  <style>
    .bg { fill: #ffffff; }
    .code {
      font: 31px "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre;
      letter-spacing: 0;
    }
    .plain { fill: #111111; }
    .kw { fill: #8b168f; }
    .defname { fill: #1437d9; }
    .builtin { fill: #2717a8; }
    .str { fill: #aa2634; }
    .num { fill: #4d8c7f; }
    .comment { fill: #a66f35; }
    .op { fill: #a64c5a; }
    .muted { fill: #5f676c; }
  </style>

  <rect class="bg" width="1320" height="900"/>

  <text class="code" x="58" y="58">
    <tspan class="comment"># 信息熵计算演示</tspan>
    <tspan x="58" dy="52"><tspan class="kw">import</tspan><tspan class="plain"> math</tspan></tspan>
    <tspan x="58" dy="52"><tspan class="kw">import</tspan><tspan class="plain"> numpy </tspan><tspan class="kw">as</tspan><tspan class="plain"> np</tspan></tspan>
    <tspan x="58" dy="52"><tspan class="kw">import</tspan><tspan class="plain"> matplotlib.pyplot </tspan><tspan class="kw">as</tspan><tspan class="plain"> mp</tspan></tspan>

    <tspan x="58" dy="88"><tspan class="plain">class_num = </tspan><tspan class="num">10</tspan><tspan class="plain">  </tspan><tspan class="comment"># 类别最大数量</tspan></tspan>

    <tspan x="58" dy="98"><tspan class="kw">def</tspan><tspan class="plain"> </tspan><tspan class="defname">entropy_calc</tspan><tspan class="plain">(n):</tspan></tspan>
    <tspan x="138" dy="52"><tspan class="plain">p = </tspan><tspan class="num">1.0</tspan><tspan class="plain"> </tspan><tspan class="op">/</tspan><tspan class="plain"> n  </tspan><tspan class="comment"># 计算每个类别的概率  假设这里每个类别的概率相同</tspan></tspan>
    <tspan x="138" dy="52"><tspan class="plain">entropy_value = </tspan><tspan class="num">0.0</tspan><tspan class="plain">  </tspan><tspan class="comment"># 信息熵</tspan></tspan>

    <tspan x="138" dy="82"><tspan class="kw">for</tspan><tspan class="plain"> i </tspan><tspan class="kw">in</tspan><tspan class="plain"> </tspan><tspan class="builtin">range</tspan><tspan class="plain">(n):</tspan></tspan>
    <tspan x="218" dy="52"><tspan class="plain">p_i = p </tspan><tspan class="op">*</tspan><tspan class="plain"> math.log(p)  </tspan><tspan class="comment"># 深度学习里用 e 为底主要是求导方便</tspan></tspan>
    <tspan x="218" dy="52"><tspan class="plain">entropy_value += p_i</tspan></tspan>

    <tspan x="138" dy="82"><tspan class="kw">return</tspan><tspan class="plain"> </tspan><tspan class="op">-</tspan><tspan class="plain">entropy_value  </tspan><tspan class="comment"># 返回熵值</tspan></tspan>

    <tspan x="58" dy="96"><tspan class="plain">entropies = []</tspan></tspan>
    <tspan x="58" dy="52"><tspan class="kw">for</tspan><tspan class="plain"> i </tspan><tspan class="kw">in</tspan><tspan class="plain"> </tspan><tspan class="builtin">range</tspan><tspan class="plain">(</tspan><tspan class="num">1</tspan><tspan class="plain">, class_num </tspan><tspan class="op">+</tspan><tspan class="plain"> </tspan><tspan class="num">1</tspan><tspan class="plain">):</tspan></tspan>
    <tspan x="138" dy="52"><tspan class="plain">entropy = entropy_calc(i)  </tspan><tspan class="comment"># 计算类别为i的熵值</tspan></tspan>
    <tspan x="138" dy="52"><tspan class="plain">entropies.append(entropy)</tspan></tspan>

    <tspan x="58" dy="82"><tspan class="builtin">print</tspan><tspan class="plain">(entropies)</tspan></tspan>
  </text>
</svg>
