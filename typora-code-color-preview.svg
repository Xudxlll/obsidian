<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <style>
    .page { fill: #f5f7f8; }
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34495e; }
    .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627384; }
    .card-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34495e; }
    .caption { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627384; }
    .code { font: 16px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; white-space: pre; }
    .shadow { filter: drop-shadow(0 18px 28px rgb(52 73 94 / 0.14)); }
  </style>

  <rect class="page" width="1280" height="620"/>
  <text class="title" x="64" y="60">Typora / Typora-Vue Code Preview</text>
  <text class="subtitle" x="64" y="88">Left: what your current Typora-Vue theme mainly defines. Right: a Python syntax palette that matches the same note style.</text>

  <!-- Current Typora-Vue base -->
  <g class="shadow" transform="translate(64 130)">
    <rect width="550" height="380" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text class="card-title" x="28" y="38">Current Typora-Vue Base</text>
    <text class="caption" x="28" y="62">Background, border, and inline-code accent from your installed theme.</text>
    <rect x="28" y="88" width="494" height="224" rx="6" fill="#f8f8f8" stroke="#f4f4f4"/>
    <text class="code" x="50" y="126">
      <tspan fill="#34495e"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">def calculate_total(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">    total = price * (1 + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">    if total &gt; 100:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">        return "expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">    return total</tspan></tspan>
    </text>
    <text class="caption" x="28" y="344">Inline code accent: </text>
    <rect x="146" y="326" width="120" height="28" rx="5" fill="#f8f8f8" stroke="#f4f4f4"/>
    <text class="code" x="158" y="346" fill="#e96900">print()</text>
  </g>

  <!-- Typora-Vue Python enhanced -->
  <g class="shadow" transform="translate(666 130)">
    <rect width="550" height="380" rx="10" fill="#ffffff" stroke="#d9eee5"/>
    <text class="card-title" x="28" y="38">Typora-Vue Python Enhanced</text>
    <text class="caption" x="28" y="62">A custom Python palette built around Vue green and Typora orange.</text>
    <rect x="28" y="88" width="494" height="224" rx="6" fill="#f8f8f8" stroke="#f4f4f4"/>
    <text class="code" x="50" y="126">
      <tspan fill="#8c9aa8"># calculate final price</tspan>
      <tspan x="50" dy="26"><tspan fill="#42b983">def</tspan><tspan fill="#34495e"> </tspan><tspan fill="#3e8ed0">calculate_total</tspan><tspan fill="#34495e">(price, tax_rate):</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#34495e">    total = price * (</tspan><tspan fill="#e96900">1</tspan><tspan fill="#34495e"> + tax_rate)</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#42b983">    if</tspan><tspan fill="#34495e"> total &gt; </tspan><tspan fill="#e96900">100</tspan><tspan fill="#34495e">:</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#42b983">        return</tspan><tspan fill="#34495e"> </tspan><tspan fill="#e96900">"expensive"</tspan></tspan>
      <tspan x="50" dy="26"><tspan fill="#42b983">    return</tspan><tspan fill="#34495e"> total</tspan></tspan>
    </text>
    <rect x="28" y="332" width="14" height="14" rx="3" fill="#42b983"/>
    <text class="caption" x="50" y="344">keywords</text>
    <rect x="142" y="332" width="14" height="14" rx="3" fill="#3e8ed0"/>
    <text class="caption" x="164" y="344">functions</text>
    <rect x="262" y="332" width="14" height="14" rx="3" fill="#e96900"/>
    <text class="caption" x="284" y="344">strings / numbers</text>
    <rect x="430" y="332" width="14" height="14" rx="3" fill="#8c9aa8"/>
    <text class="caption" x="452" y="344">comments</text>
  </g>
</svg>
